<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Uzbek Learning Hub | Uzbek Pro Academy</title>

<meta name="description" content="Learn Uzbek with practical vocabulary, speaking tips, grammar, pronunciation, culture and everyday phrases.">

<style>
:root{
  --blue:#0066B3;
  --blue-dark:#004B82;
  --green:#1EB53A;
  --red:#CE1126;
  --navy:#0B1724;
  --text:#17212B;
  --muted:#66727E;
  --bg:#F5F8FB;
  --white:#FFFFFF;
  --border:#E3E9EF;
  --shadow:0 18px 55px rgba(10,35,60,.10);
  --max:1180px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
}

a{
  text-decoration:none;
  color:inherit;
}

.container{
  width:min(92%,var(--max));
  margin:auto;
}


/* TOP BAR */

.topbar{
  background:var(--navy);
  color:white;
  text-align:center;
  padding:9px 15px;
  font-size:13px;
}


/* NAVIGATION */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
}

.nav{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

.logo{
  font-size:19px;
  font-weight:850;
  white-space:nowrap;
}

.logo span{
  color:var(--blue);
}

.nav-links{
  display:flex;
  align-items:center;
  gap:19px;
  font-size:13px;
  font-weight:700;
}

.nav-links a{
  transition:.2s;
}

.nav-links a:hover{
  color:var(--blue);
}

.nav-button{
  background:var(--blue);
  color:white!important;
  padding:11px 18px;
  border-radius:999px;
}


/* HERO */

.hero{
  background:white;
  padding:85px 0 75px;
  text-align:center;
}

.eyebrow{
  display:inline-block;
  padding:8px 15px;
  background:#F1F7FC;
  border:1px solid #DCEAF4;
  color:var(--blue-dark);
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  margin-bottom:22px;
}

.hero h1{
  font-size:clamp(45px,7vw,72px);
  line-height:1;
  letter-spacing:-4px;
  color:var(--navy);
  margin-bottom:22px;
}

.hero h1 span{
  color:var(--blue);
}

.hero p{
  max-width:690px;
  margin:auto;
  color:var(--muted);
  font-size:18px;
}


/* CATEGORY */

.categories{
  background:white;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}

.category-inner{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
}

.category-inner a{
  padding:18px 23px;
  font-size:12px;
  font-weight:800;
  border-right:1px solid var(--border);
  transition:.2s;
}

.category-inner a:hover{
  color:var(--blue);
  background:#F6F9FC;
}


/* MAIN */

.blog{
  padding:85px 0;
}

.section-title{
  margin-bottom:38px;
}

.section-title .label{
  color:var(--blue);
  text-transform:uppercase;
  letter-spacing:2px
